name: Deploy Ionic App Locally

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        run: docker build -t patient-crud:latest .

      - name: Remove previous container
        run: docker rm -f patient-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name patient-crud --restart unless-stopped -p 8101:8101 patient-crud:latest