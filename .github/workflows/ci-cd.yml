name: Deploy Ionic App Locally

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        run: docker build -t care-directory:latest .

      - name: Remove previous container
        run: docker rm -f care-directory
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name care-directory --restart unless-stopped -p 8100:8100 care-directory:latest